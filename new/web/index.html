<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeWebStream</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">ClaudeWebStream</div>
    <button id="new-chat-btn" class="primary">+ New chat</button>
    <div class="section-title">Conversations</div>
    <ul id="conv-list" class="list"></ul>
    <div class="section-title">Account</div>
    <label>Username <input id="username"></label>
    <label>Password <input id="password" type="password"></label>
    <button id="login-btn">Login</button>
    <label>API Key <input id="api-key" type="password"></label>
    <button id="save-key-btn">Save Key</button>
    <div id="user-id" class="mono small"></div>
    <div id="status-pill" class="pill">offline</div>
  </aside>
  <main class="chat">
    <div class="chat-header">
      <select id="model-select"></select>
      <select id="effort-select">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div id="messages" class="messages"></div>
    <div class="composer">
      <textarea id="prompt" placeholder="Message Claude..."></textarea>
      <button id="send-btn" class="primary">Send</button>
    </div>
  </main>
  <aside class="panel">
    <div class="panel-section">
      <h3>Thinking</h3>
      <div id="thinking-panel" class="thinking"></div>
    </div>
    <div class="panel-section">
      <h3>Tool Calls</h3>
      <pre id="tools-panel" class="mono small"></pre>
    </div>
    <div class="panel-section">
      <h3>Artifacts</h3>
      <ul id="artifacts-list" class="list"></ul>
    </div>
    <div class="panel-section">
      <h3>Usage</h3>
      <pre id="usage-panel" class="mono small"></pre>
    </div>
  </aside>
</div>
<script src="/app.js"></script>
</body>
</html>
