[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claudewebstream"
version = "0.1.0"
description = "Local FastAPI streaming server over claude.ai web sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.19",
  "cryptography>=42",
  "argon2-cffi>=23",
  "curl_cffi>=0.7",
  "httpx>=0.27",
  "typer>=0.12",
  "python-multipart>=0.0.9",
  "aiosqlite>=0.19",
]

[project.scripts]
cws = "claudewebstream.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]